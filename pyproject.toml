[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebirforms2pdf"
version = "0.1.0"
description = "Export offline eBIRForms (BIR Philippines) drafts as print-ready A4 PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "eBIRForms2PDF contributors" }]
dependencies = ["pefile", "playwright", "pypdf"]

[project.scripts]
ebirforms2pdf = "ebirforms2pdf.__main__:main"
ebirforms2pdf-gui = "ebirforms2pdf.gui:main"

[tool.setuptools.packages.find]
include = ["ebirforms2pdf*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
